[package]
name = "zed-http-cli"
version = "0.4.7"
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "zed-http"
path = "src/main.rs"

[dependencies]
zed-http-core = { path = "../zed-http-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "http2", "charset"] }
serde_json = { version = "1", features = ["preserve_order"] }
cookie_store = "0.21"
reqwest_cookie_store = "0.8"
indexmap = "2"
clap_complete = "4"

[package]
name = "zed-http-cli"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "zed-http"
path = "src/main.rs"

[dependencies]
zed-http-core = { path = "../zed-http-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = { version = "1", features = ["preserve_order"] }

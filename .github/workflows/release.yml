name: Release

# Fires when a maintainer pushes an annotated `v*` tag (e.g. `v0.4.8`).
# Three jobs:
#
#   1. verify          — the test suite plus the version-lockstep check,
#      including that the tag matches the version the crates declare.
#      Everything else depends on this, so a tag pushed onto a broken
#      commit never gets a release, let alone binaries.
#
#   2. create-release  — runs once on ubuntu-latest, creates the
#      GitHub Release using the tag's annotation as the body. This must
#      complete before the matrix uploads anything, otherwise the
#      taiki-e action sees "release not found" and gives up.
#
#   3. build           — matrix over five targets, builds zed-http, and
#      attaches each archive + SHA-256 sidecar to the release.
#
# All inputs to this workflow are either hardcoded in the matrix below
# or come from secrets.GITHUB_TOKEN — no untrusted event payload is
# interpolated into any run: command. The only template inputs are
# matrix.target and matrix.os (hardcoded include entries) and
# github.ref_name, which is the tag name we ourselves push.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-verify

      # CI already ran the suite on three OSes for this commit when it landed
      # on main. Re-running it here on one OS is the gate that a tag cannot
      # skip: it is the tagged tree, not a branch, that ships.
      - run: cargo test --workspace --locked

      # `github.ref_name` is a tag we pushed ourselves, but pass it through
      # env rather than interpolating it into the shell command.
      - name: Assert versions are in lockstep with the tag
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-versions.sh "$TAG"

  create-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Fetch tags + their annotations so --notes-from-tag works.
        with:
          fetch-depth: 0

      - name: Create release from tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: if a maintainer re-runs the workflow against
          # the same tag (e.g. after a transient failure), don't fail
          # just because the release already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-from-tag \
              --verify-tag
          fi

  build:
    name: ${{ matrix.target }}
    # create-release already depends on verify; naming both keeps the gate
    # explicit if the release step is ever reordered.
    needs: [verify, create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 cross-compiler (Linux only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo registry + build output
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Upload binary to release
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: zed-http
          target: ${{ matrix.target }}
          # Package shape: zed-http-<target>.tar.gz or .zip
          archive: zed-http-$target
          tar: unix
          zip: windows
          # SHA-256 sidecar per artefact.
          checksum: sha256
          # Only the CLI crate ships a binary.
          manifest_path: crates/zed-http-cli/Cargo.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # When cross-compiling aarch64 linux on an x86_64 runner we
          # need the matching linker; the apt install above provides it.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

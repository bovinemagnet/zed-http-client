name: CI

# Validates pushes to `main` and every pull request: tests must pass,
# clippy must be clean at -D warnings, and the formatter must be a
# no-op. Matches what the user runs locally before tagging a release.
#
# No untrusted event payload is interpolated into a run: command;
# matrix.os is hardcoded in the matrix include.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - run: cargo test --workspace --locked

  lints:
    name: clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lints
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  versions:
    name: version lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-versions.sh

  extension:
    name: extension + grammar queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # python3 on ubuntu-latest is >= 3.11, so tomllib is in the stdlib.
      - run: ./scripts/check-extension.sh

  docs:
    name: antora docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # --log-failure-level=warn is what turns a broken xref or a page missing
      # from nav.adoc into a failed build; without it Antora logs and exits 0.
      - run: npx -y antora@3.1.12 --fetch --log-failure-level=warn antora-playbook.yml

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    # Verify the crates still compile on the rust-version declared in
    # Cargo.toml. Lints are enforced by the `lints` job on stable; here we
    # only care about buildability, so clear -Dwarnings to avoid failing on
    # a benign lint that differs between 1.88 and stable.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --locked
